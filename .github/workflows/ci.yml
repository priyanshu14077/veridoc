name: ci
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crosscheck
          POSTGRES_PASSWORD: crosscheck
          POSTGRES_DB: crosscheck_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U crosscheck" --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npm run build

  stack:
    # The production stack (deploy/compose.yml) builds, starts and serves over HTTPS. The same run
    # adds the local monitoring overlay and proves telemetry reaches every backend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Production compose has no monitoring in it
        run: |
          printf 'SITE_ADDRESS=localhost\nPOSTGRES_PASSWORD=%s\nGRAFANA_ADMIN_PASSWORD=%s\n' \
            "$(openssl rand -hex 24)" "$(openssl rand -hex 16)" > deploy/.env
          services=$(docker compose -f deploy/compose.yml --env-file deploy/.env config --services | sort | xargs)
          test "$services" = "api caddy db web worker" || { echo "unexpected: $services"; exit 1; }
      - name: Start the app with the local monitoring overlay
        run: deploy/observability/run.sh up
      - name: Smoke test through Caddy
        run: |
          for i in $(seq 1 30); do curl -fsk https://localhost/api/health && break; sleep 2; done
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/reports/accuracy)" = 401
          curl -fsk https://localhost/login | grep -q Veridoc
          curl -sk -D headers.txt -c jar.txt -H 'Origin: https://localhost' \
            -H 'Content-Type: application/json' \
            -d '{"email":"anil.manager@veridoc.demo","password":"veridoc-demo"}' \
            https://localhost/api/auth/login
          grep -i '^set-cookie:.*secure' headers.txt
          grep -i '^strict-transport-security' headers.txt
          curl -fsk -b jar.txt https://localhost/api/reports/accuracy | grep -q '"shipments":4'
          test "$(curl -sk -o /dev/null -w '%{http_code}' -b jar.txt -X POST \
            -H 'Origin: https://evil.example' https://localhost/api/shipments)" = 403
      - name: Telemetry reaches metrics, logs and traces
        run: |
          pw=$(grep '^GRAFANA_ADMIN_PASSWORD=' deploy/.env | cut -d= -f2)
          g() { curl -fs -u "admin:$pw" "http://localhost:3001/api/$1" "${@:2}"; }
          vm() { g "datasources/proxy/uid/vm/api/v1/query" -G --data-urlencode "query=$1"; }
          # Grafana requires its login; nothing about it is public.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/dashboards/uid/veridoc-overview)" = 401
          for ds in vm vlogs traces; do g "datasources/uid/$ds/health" | grep -q '"OK"'; done
          g dashboards/uid/veridoc-overview | grep -q 'Veridoc overview'
          test "$(g v1/provisioning/alert-rules | jq length)" -ge 8
          for i in $(seq 1 24); do  # metrics are exported every 15–30 s
            vm 'count(http_server_request_duration_seconds_count{service_name="veridoc-api"})' | jq -e '.data.result | length > 0' >/dev/null \
              && vm 'count(veridoc_jobs_count)' | jq -e '.data.result | length > 0' >/dev/null \
              && vm 'count(container_memory_usage_total_bytes)' | jq -e '.data.result | length > 0' >/dev/null \
              && vm 'count(system_filesystem_utilization_ratio)' | jq -e '.data.result | length > 0' >/dev/null \
              && break
            sleep 5
          done
          vm 'count(system_filesystem_utilization_ratio)' | jq -e '.data.result | length > 0'
          # Every alert rule must evaluate without errors.
          g prometheus/grafana/api/v1/rules | jq -e '[.data.groups[].rules[] | select(.health != "ok")] | length == 0'
          # A request through Caddy appears as one trace spanning Caddy and the API.
          g "datasources/proxy/uid/traces/api/services" | jq -e '.data | index("caddy") and index("veridoc-api")'
          # API logs arrive parsed (level is a field, not part of the text).
          g "datasources/proxy/uid/vlogs/select/logsql/query" -G \
            --data-urlencode 'query=service.name:api AND level:info' --data-urlencode limit=1 | grep -q '"level":"info"'
      - name: Monitoring report
        run: |
          deploy/observability/run.sh traffic 20
          sleep 40  # one more metric export
          deploy/observability/run.sh report 15m | tee monitoring-report.md
          grep -q 'Monitoring (local only)' monitoring-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-report
          path: monitoring-report.md
          if-no-files-found: ignore
      - if: failure()
        run: deploy/observability/run.sh logs --tail 200

  deploy:
    # Every push to master that passes the three jobs above goes to the EC2 server.
    # Stays off until the repo variable SITE_ADDRESS is set (see docs/deployment.md §3.6).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.SITE_ADDRESS != ''
    needs: [api, web, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false  # never stop a deploy halfway through a build
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy ${{ github.sha }}
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "ubuntu@$HOST" "bash -s -- ${{ github.sha }}" < deploy/deploy.sh
      - name: Smoke test the live site
        env:
          SITE: https://${{ vars.SITE_ADDRESS }}
        run: |
          for i in $(seq 1 30); do curl -fs "$SITE/api/health" && break; sleep 5; done
          curl -fs "$SITE/login" | grep -q Veridoc
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $SITE" \
            -H 'Content-Type: application/json' \
            -d '{"email":"anil.manager@veridoc.demo","password":"veridoc-demo"}' \
            "$SITE/api/auth/login")" = 200
