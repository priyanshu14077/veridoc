services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crosscheck
      POSTGRES_PASSWORD: crosscheck   # local-only dev credential
      POSTGRES_DB: crosscheck
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosscheck"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
