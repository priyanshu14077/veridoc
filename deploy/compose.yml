# Production: Postgres, API, extraction worker, web and Caddy (HTTPS) on one server.
# Run from the repo root:  docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# Monitoring is not part of production. It runs on a laptop as an overlay on this file:
# deploy/compose.observability.yml (see docs/observability.md).
# The project, database and user keep the old "crosscheck" name: renaming the project would
# start new, empty volumes, and Postgres only reads POSTGRES_USER/DB when it first creates them.
name: crosscheck

# Every container logs JSON lines to a capped file (Docker's default never rotates and can fill
# the disk). The compose service name rides along on each line, so `docker compose logs` and the
# local log collector can tell apart api, worker, web, caddy and db.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
    labels: com.docker.compose.service

x-api: &api
  build:
    context: ..
    dockerfile: api/Dockerfile
  image: veridoc-api
  restart: unless-stopped
  logging: *logging
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://crosscheck:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/crosscheck
    COOKIE_SECURE: "true"
    ALLOWED_ORIGINS: '["https://${SITE_ADDRESS:?set SITE_ADDRESS}"]'
    TRUST_PROXY: "true"
  volumes:
    - storage:/data/storage

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: crosscheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: crosscheck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosscheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No ports: only the other containers can reach the database.

  api:
    <<: *api
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy  # the API runs the migrations first

  web:
    build:
      context: ../web
      args:
        API_ORIGIN: http://api:8000
    image: veridoc-web
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
