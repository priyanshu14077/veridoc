[project]
name = "veridoc-api"
version = "0.1.0"
description = "Veridoc API: shipment document extraction and cross-checks"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Deterministic randomness for drawing synthetic documents, not security.
"scripts/*" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
